<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Link Redirector</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Paste Link to Redirect</h2>
    <form id="redirectForm">
        <input type="text" id="urlInput" placeholder="Enter or paste your URL here..." required autocomplete="off">
        <button type="submit">Go to Link</button>
    </form>
</div>

<script>
    document.getElementById('redirectForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Stop the form from performing a normal submit
        
        let url = document.getElementById('urlInput').value.trim();
        
        // If the URL doesn't start with http:// or https://, prepend https://
        if (!/^https?:\/\//i.test(url)) {
            url = 'https://' + url;
        }
        
        // Redirect the current browser window to the target link
        window.location.href = url;
    });
</script>

</body>
</html>
